  mission:
    link: "https://discord.com/channels/%{guild_id}/%{channel_id}/%{message_id}"
    embed:
      no_assignee: "Nobody Yet! Accept the mission below!"
      field:
        instructions: "Instructions:"
        status: "Status:"
        issuer: "Issuer:"
        assignee: "Assignee:"
        wiki_page: "Page:"
        map_link: "Nearest Map Location:"
        language: "Language:"
        rule: "Image Ruleset:"
    instructions:
      page_create: >
        Create or Edit the wiki page %{wiki_page_md}. This will be automatically detected by the system
      page_update: >
        Edit the wiki page %{wiki_page_md}. This will be automatically detected by the system
      image_upload: >
        Post one or more images in the discord, tagging the bot. It will prompt you if the images are related to this
        mission. Press the confirm button to submit
      page_translate: >
        Translate %{wiki_page} into %{language}. This will be automatically detected by the system
    post:
      accept_mission: "Accept"
      approve_mission: "Approve"
      reject_mission: "Reject"
      abandon_mission: "Abandon"
      admin_notification: "@here A new submission landed!"
      link: "https://discord.com/channels/%{guild_id}/%{channel}/%{message_id}"
  discord:
    commands:
      something_went_wrong: 'Oops. Something went wrong! The devs have been notified!'
      dev_error: "⚠️Mentat Error!\n User: %{user}\n Service: %{service}\n Error: ```%{message}```\n```%{backtrace}```"
      admin:
        auto_block:
          reason: "Automatically blocked by System for suspected spam/abuse"
        reaction_block:
          reason: "Blocked by %{admin} via Discord for suspected spam/abuse"
        reaction_unblock:
          reason: "Unblocked by %{admin} via Discord"
        tooltip:
          wiki_admin: "Tools for Mentat Wiki Admins"
          verify_board: "Post the verify board with buttons to configured channels"
          editor_board: "Post the editor tool board"
        verify_board:
          success: "Posted!"
          failure:
            no_access: 'You need to be an admin to perform this!'
            disabled: >
              There are no Wikis configured to allow Wiki User Verification.
              Log into %{website} to configure a wiki to enable this feature.
            no_channels: >
              There are no channels configured to post Verification Boards to.
              Log into %{website} to configure channels for Verify Boards.
              Note: This must be configured for each wiki separately.
          link: "Link Account"
          lookup: "Lookup User"
          embed:
            title: "Link Your %{wiki} Account"
            description: >
              Use the buttons below to link your wiki accounts, 
              or look up accounts belonging to another user.
              Please note that wiki usernames are case sensitive.
        manually_verify:
          not_found: 'User not found'
          already_verified: "<@%{user_id}> is already verified as %{wiki_username}!"
          success: 'Successfully verified <@%{user_id}> as the owner of %{wiki_username}!'
        manually_submit_mission:
          not_found: 'Mission not found!'
          not_accepted: "That mission is not in progress!"
          success: 'Successfully submitted Mission [%{mission_id}]!'
          notify: >
            <@%{user}> Thank you for your submission for mission %{summary}! 
            It will be reviewed by staff.
            You can continue updating the wiki page if you need in the meantime.
            Thanks so much for your contribution! 🏅
      user:
        tooltip:
          wiki_user: "Sync Wiki accounts to discord"
          lookup: "Look up Wiki accounts belong to a discord user (defaults to self)"
          user: "The discord user to look up verified Wiki accounts"
        search:
          content: "Lookup verified wiki accounts"
          placeholder: "Discord User"
        link_modal:
          title: "Link Wiki User Account"
          wiki_username: "Wiki Username"
        claim:
          already_claimed: "%{wiki_username} has already been verified as <@%{owner_id}>"
          already_verified: "You have already been verified as %{wiki_username}!"
          instructions: >
            You can automatically verify with this link:
            %{wiki_url}/Mentat:Verify?claim_code=%{claim_code}
            
            If there is an issue with the above link, you can still manually verify by
            logging into the wiki as %{wiki_username} and make an edit to any page.
            In the Summary of your changes, add the following verification code.
            ```WM_%{claim_code}_UV```
            You can edit any page with any content for this to be detected.
            For example you can create or edit -
            %{wiki_url}/User:%{wiki_username}/Mentat_User_Claim
        verify:
          success: "<@%{user}> successfully verified ownership of %{wiki_username} on %{wiki}!"
        lookup:
          not_found: "Sorry, that user has not verified any wiki accounts"
          found: "<@%{user_id}> Has verified ownership of the following wiki accounts:\n %{wiki_usernames}"
        upload_image:
          unknown_command: "<@%{user_id}> Sorry, I don't know what you're asking!"
          not_enabled: "<@%{user_id}> Sorry, this server does not have wiki image uploads enabled!"
          no_attachments: "<@%{user.id}> You haven't attached any images!"
          no_title: "<@%{user.id}> You need to tell me a title for these images!"
          rules_not_met: >
            <@%{user_id}> Sorry, these files do not meet the image requirements:

            - %{errors}

            Please correct and re-upload with the same command
          error: "<@%{user_id}> Sorry, something went wrong. Ask Mojo for help! Error: ```%{error}```"
          aborted_error: "<@%{user_id}> Sorry, something went wrong. This is likely due to a duplicate image being uploaded."
          comment: "Uploaded via Discord by %{username}"
          success: >
            <@%{user_id}> Uploaded:

            - %{files}

            for you!
          rules:
            min_width: "Width is too small. Minimum width: %{rule_value}px. Image width: %{image_value}px"
            max_width: "Width is too large. Maximum width: %{rule_value}px. Image width: %{image_value}px"
            min_height: "Height is too small. Minimum height: %{rule_value}px. Image height: %{image_value}px"
            max_height: "Height is too large. Maximum height: %{rule_value}px. Image height: %{image_value}px"
            format: "Incorrect image format. Required format: %{rule_value}. Format found: %{image_value}"
            ratio: "Incorrect image W:H ratio. Required ratio: 1:%{rule_value}. Ratio found: 1:%{image_value}"
      missions:
        not_enabled: 'Sorry. Missions are not enabled on this server.'
        tooltip:
          post: 'Post a new mission for the community'
          abandon: 'Abandon your current mission'
          cancel: 'Cancel a mission'
          count: 'Show how many missions someone has completed (defaults to your own mission count)'
          find: "Show a user's current mission (defaults to your own mission)"
          rewards: 'Claim and view your rewards earned by completing missions!'
          manually_reward: 'Manually give a player a reward'
          grant: 'Grant a player a number of mission credits'
          fields:
            id: 'ID of the mission to cancel'
        init:
          prompt: "What type of mission do you want to post?"
          placeholder: "Select One"
          page_create: "Create Page"
          page_update: "Update Page"
          image_upload: "Upload Image"
          page_translate: "Translate Page"
        new:
          title: "New %{type} Mission"
          page_create: "Create Page"
          page_update: "Update Page"
          image_upload: "Upload Image"
          page_translate: "Translate Page"
          label:
            title: "Mission Title"
            description: "Mission Description"
            wiki_page: "Wiki Page"
            map_link: "Nearest Map Location"
            language: "Language Code"
            rule: "Image Ruleset"
          placeholder:
            title: "Title"
            description: "Mission Description"
            wiki_page: "%{wiki}/Some_Page"
            map_link: "%{wiki}/Map?marker=MARKER_ID"
            language: "en"
            rule: "e.g. menu"
          value:
            description:
              page_create: >
                This page needs creating, with as much detail as possible. Include Categories X,Y,Z
              page_update: >
                Please update this page to add X,Y,Z
              image_upload: >
                We need screenshots of X for this page
              page_translate: >
                We need this page translating into X
        create:
          errors: "Could not post mission: %{errors}"
          success: "Posted mission [%{id}] %{link}"
        accept:
          not_found: "Sorry, something went wrong, that mission is no longer available"
          must_verify: "You must verify your wiki user first. See <#%{verification_channel}>"
          already_on_mission: >
            You have an active mission already: %{summary}.
            You must complete or abandon it before taking a new one
          accepted_mission: >
            Thank you! You are now on mission %{summary}!
            ```%{instructions}```
            To abandon this mission, simply `/abandon_mission`
        approve:
          approved_mission: "Completed mission %{summary}!"
          celebration: "🎉<@%{user}> Has completed a mission - %{summary}! They have now completed **%{count}** missions! 🎉"
          reward: "@here️ 🎖<@%{user}> Has completed %{count} Missions and has earned a reward!"
          not_found: "Sorry, something went wrong, can't find that mission"
          not_submitted: "Sorry, that mission has not had a submission yet"
          not_assigned: "Sorry, nobody is on that mission"
          reward_out_of_stock: "⚠️ OUT OF STOCK! <@%{user_id}> earned a %{reward} but we have none to give! ⚠️"
          confirm: 'Approve'
        reject:
          rejected_mission: "Rejected mission %{summary}! Notified user"
          rejected_abandoned_mission: "Rejected mission %{summary}! Set to available as user has a new mission."
          rejected_mission_no_feedback: "Rejected mission %{summary}! ⚠️ Unable to notify user! Please DM ⚠️"
          feedback: >
            Sorry, your submission to mission %{summary} was rejected.
            Please reach out to moderators for assistance.
          abandon: >
            As you are now on %{current_mission}, you must complete or abandon that before you can pick up %{summary}.
            It has now been set back to available and you can pick it up later here %{link}
          not_found: "Sorry, something went wrong, can't find that mission"
          not_submitted: "Sorry, that mission has not had a submission yet"
          not_assigned: "Sorry, nobody is on that mission"
        abandon:
          not_found: "You are not currently on a mission"
          not_yours: "This is not your mission to abandon"
          abandoned_mission: "You have abandoned the mission %{summary}"
        cancel:
          not_found: "Could not find mission."
          cancelled_mission: "You have cancelled the mission %{summary}"
        count:
          not_found: 'Sorry, cannot find that user!'
          found_self: "You have completed %{count} missions."
          found: "<@%{user_id}> has completed %{count} missions."
        find:
          not_found: 'Sorry, cannot find that user!'
          found_self: "You are currently on %{summary}. Mission post link: %{link}"
          no_mission_self: "You are not currently on a mission"
          found: "<@%{user_id}> is currently on %{summary}. Mission post link: %{link}"
          no_mission: "<@%{user_id}> is not currently on a mission"
        submit:
          page_create:
            notify: >
              <@%{user}> Thank you for your submission for mission %{summary}! 
              It will be reviewed by staff.
              You can continue updating the wiki page if you need in the meantime.
              Thanks so much for your contribution! 🏅
          page_update:
            notify: >
              <@%{user}> Thank you for your submission for mission %{summary}! 
              It will be reviewed by staff.
              You can continue updating the wiki page if you need in the meantime.
              Thanks so much for your contribution! 🏅
          upload_image:
            link: "%{wiki}/File:%{image_name}"
            prompt: "Did you upload these images for your current mission %{summary}?"
            confirm_button: "Confirm"
            cancel_button: "Cancel"
            confirm:
              not_you: "This button is not yours to push! 😠"
              not_found: "Sorry, something went wrong, can't find that mission"
              submitted_mission: >
                Submitted your image for the mission. It will be reviewed by staff.
                Thanks so much for your contribution! 🏅
            cancel:
              not_you: "This button is not yours to push! 😠"
              not_found: "Sorry, something went wrong, can't find that mission"
              cancel_submission: "No problem! Thank you for uploading the image"
        rewards:
          not_enabled: 'Sorry. Rewards are not enabled on this server.'
          no_rewards: "Sorry you haven't earned any rewards yet! See the missions board to get started!"
          message: >
            Congratulations! You have earned the following rewards:
            
            - %{rewards}
        reward:
          not_found: "Reward not found or already approved"
          approved: "🏅Issued <@%{user_id}> a key for %{reward} - `%{key}`"
          broadcast: "🏅Congratulations! <@%{user_id}> earned %{reward}! Use `/rewards` to claim your key!"
          already_claimed: 'That user already has that reward. Unclaiming'
        manually_reward:
          not_enabled: 'Sorry. Rewards are not enabled on this server.'
          reward: "@here️ 🎖<@%{user}> Has been manually awarded the %{reward} by <@%{admin}>."
          not_found: "Sorry, something went wrong, can't find that user"
          reward_out_of_stock: "⚠️ OUT OF STOCK! <@%{user_id}> was issued a %{reward} but we have none to give! ⚠️"
          confirm: 'Approve'
          issued: 'Issued the user a reward! It needs to be approved before they can receive it'
        grant:
          not_enabled: 'Sorry. Missions are not enabled on this server.'
          not_found: "Sorry, something went wrong, can't find that user"
          granted: "Granted %{count} mission credits to <@%{user_id}>"
